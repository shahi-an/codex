{% extends 'base.html' %}
{% block content %}
<h1 class="h3 mb-3">Import Vulnerability Report</h1>
<p class="text-muted">Upload an Excel file (.xlsx). Expected columns include: <code>server_name</code>, <code>vulnerability_type</code>, <code>description</code>, <code>severity</code>, and optional <code>status</code>.</p>

<form method="post" enctype="multipart/form-data" class="card p-4">
  <div class="mb-3">
    <label class="form-label">Excel report</label>
    <input class="form-control" type="file" name="excel_file" accept=".xlsx,.xls" required />
  </div>
  <div>
    <button class="btn btn-primary" type="submit">Import</button>
  </div>
</form>
{% endblock %}
