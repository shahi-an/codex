<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vulnerability Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Vulnerability Tracker</a>
        <div class="navbar-nav">
          <a class="nav-link" href="{{ url_for('import_excel') }}">Import Excel</a>
          <a class="nav-link" href="{{ url_for('assignment_rules') }}">Assignment Rules</a>
        </div>
      </div>
    </nav>

    <main class="container pb-5">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
      {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
