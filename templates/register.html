{% extends 'base.html' %}
{% block content %}
<h1 class="h3 mb-3">Maid Registration</h1>
<form method="post" class="card p-4 shadow-sm">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Full Name</label>
      <input class="form-control" name="name" required />
    </div>
    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input class="form-control" type="email" name="email" required />
    </div>
    <div class="col-md-3">
      <label class="form-label">Age</label>
      <input class="form-control" type="number" min="18" name="age" required />
    </div>
    <div class="col-md-3">
      <label class="form-label">Experience (Years)</label>
      <input class="form-control" type="number" min="0" name="experience_years" required />
    </div>
    <div class="col-md-6">
      <label class="form-label">Phone Number</label>
      <input class="form-control" name="phone_number" required />
    </div>
    <div class="col-12">
      <label class="form-label">Current Address</label>
      <input class="form-control" name="current_address" required />
    </div>
    <div class="col-md-6">
      <label class="form-label">ID Verification Status</label>
      <select class="form-select" name="id_verified" required>
        <option value="yes">ID Verified</option>
        <option value="no">Not Verified</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" required />
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="submit">Create Account</button>
    </div>
  </div>
</form>
{% endblock %}
